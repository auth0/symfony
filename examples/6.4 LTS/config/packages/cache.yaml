framework:
  cache:
    # Unique name of your app: used to compute stable namespaces for cache keys.
    prefix_seed: auth0_symfony_sample

    # The "app" cache stores to the filesystem by default. For production, consider
    # a shared backend such as Redis so the management token is reused across processes.
    app: cache.adapter.filesystem

    # [AUTH0/SYMFONY] These pools back the SDK's token_cache and management_token_cache.
    pools:
      auth0_token_cache: ~
      auth0_management_token_cache: ~
